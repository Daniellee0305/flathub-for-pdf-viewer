app-id: io.github.daniellee0305.PdfDirectViewer
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
command: pdf-direct-viewer-app.py
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=network
  - --filesystem=host
  - --env=WEBKIT_DISABLE_DMABUF_RENDERER=1
modules:
  - name: pdf-direct-viewer
    buildsystem: simple
    build-commands:
      - install -Dm755 pdf-direct-viewer-app.py /app/bin/pdf-direct-viewer-app.py
      - mkdir -p /app/share/pdfjs
      - cp -r pdfjs/* /app/share/pdfjs/
      - install -Dm644 io.github.daniellee0305.PdfDirectViewer.desktop -t /app/share/applications/
      - install -Dm644 io.github.daniellee0305.PdfDirectViewer.metainfo.xml -t /app/share/metainfo/
      - install -Dm644 images/io.github.daniellee0305.PdfDirectViewer.svg -t /app/share/icons/hicolor/scalable/apps/
    sources:
      - type: git
        url: https://github.com/Daniellee0305/PDF-direct-viewer.git
        branch: main
      - type: git
        url: https://github.com/mozilla/pdfjs-dist.git
        tag: v4.2.67
        dest: pdfjs
